# Render Blueprint — Nabra Ads Studio (free plan)
# No secret values in this file. GEMINI_API_KEY is entered in the Render
# dashboard (sync: false = Render asks for the value). It is the only key
# the app needs: Gemini powers both script generation and voice (TTS).
services:
  - type: web
    name: nabra-ads-studio
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
